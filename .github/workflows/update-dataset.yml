name: Update Dataset

on:
  schedule:
    - cron: '30 6 * * *' # 6:30 AM UTC daily (after main site updates at 6:00)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          repository: agent-gigmole/agentoolrank
          path: site

      - uses: actions/checkout@v4
        with:
          path: dataset

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install site dependencies
        run: cd site && bun install --frozen-lockfile

      - name: Export dataset
        run: cd site && bun run scripts/export-dataset.ts --output-dir=${{ github.workspace }}/dataset

      - name: Commit and push
        run: |
          cd dataset
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: daily update $(date +%Y-%m-%d)"
          git push
